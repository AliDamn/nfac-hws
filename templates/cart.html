<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <h1>Items in Your Cart</h1>
    {% if cart_items %}
        <ul>
        {% for item in cart_items %}
            <li>ID: {{ item.id }}, Name: {{ item.name }}, Price: {{ item.price }}</li>
        {% endfor %}
        </ul>
        <h3>Total: {{ total }}</h3>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}
    <a href="/flowers">Back to flowers</a>
</body>
</html>
